<!-- Product Detail Page Content Fragment -->
<!-- This file is loaded dynamically by the router into #content -->

<!-- Breadcrumb Navigation (Dynamic) -->
<div class="breadcrumb-container">
    <div class="breadcrumb-wrapper">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb" id="product-detail-breadcrumb">
                <li class="breadcrumb-item">
                    <a href="/" class="breadcrumb-link" data-navigate="/">
                        <i class="bi bi-house-door breadcrumb-home-icon"></i>
                        <span>Beranda</span>
                    </a>
                </li>
                <li class="breadcrumb-item">
                    <a href="/shop" class="breadcrumb-link" data-navigate="/shop">
                        <span>Semua Produk</span>
                    </a>
                </li>
                <li class="breadcrumb-item">
                    <a href="/shop" class="breadcrumb-link" data-navigate="/shop" id="breadcrumb-category">
                        <span>Kategori</span>
                    </a>
                </li>
                <li class="breadcrumb-item active" aria-current="page">
                    <span class="breadcrumb-link" id="breadcrumb-product-name">Detail Produk</span>
                </li>
            </ol>
        </nav>
    </div>
</div>

<section class="product-detail-page">
  <div class="container">
    <div class="product-detail-content">
      <!-- Product Image Gallery -->
      <div class="product-gallery">
        <div class="main-image-container">
          <img id="detail-product-image" src="" alt="" class="main-product-image">
          <div class="product-badge" id="detail-product-badge" style="display: none;"></div>
        </div>
        <div class="thumbnail-gallery" id="detail-thumbnail-gallery">
          <!-- Thumbnails will be loaded dynamically -->
        </div>
      </div>

      <!-- Product Information -->
      <div class="product-info">

        <h1 id="detail-product-name" class="product-title"></h1>

        <div class="product-meta">
          <div id="detail-product-rating" class="product-rating"></div>
          <span class="reviews-count">(0 reviews)</span>
          <span id="detail-product-sku" class="product-sku"></span>
        </div>

        <p id="detail-product-desc" class="product-description"></p>

        <div class="price-section">
          <span id="detail-current-price" class="current-price"></span>
          <span id="detail-original-price" class="original-price"></span>
          <span id="detail-discount-percent" class="discount-percent"></span>
        </div>

        <div class="stock-status">
          <i data-lucide="check-circle" class="in-stock-icon"></i>
          <span id="detail-stock-text">In Stock</span>
        </div>

        <div class="quantity-section">
          <label>Quantity:</label>
          <div class="quantity-selector">
            <button class="quantity-btn" id="detail-decrease-qty">-</button>
            <input type="number" id="detail-quantity" class="quantity-input" value="1" min="1" max="99">
            <button class="quantity-btn" id="detail-increase-qty">+</button>
          </div>
        </div>

        <div class="action-buttons">
          <button class="btn-primary btn-add-cart-detail" id="detail-add-to-cart">
            <i data-lucide="shopping-cart"></i>
            <span>Add to Cart</span>
          </button>
          <button class="btn-outline btn-wishlist-detail" id="detail-add-to-wishlist">
            <i data-lucide="heart"></i>
            <span>Wishlist</span>
          </button>
        </div>

        <div class="product-features">
          <h4>Product Features:</h4>
          <ul id="detail-features-list">
            <li>Fresh & High Quality</li>
            <li>100% Organic</li>
            <li>No Artificial Preservatives</li>
          </ul>
        </div>

        <div class="nutrition-info">
          <h4>Nutritional Information:</h4>
          <p id="detail-nutrition-text"></p>
        </div>
      </div>
    </div>

    <!-- Related Products Section -->
    <section class="related-products mt-5">
      <h3 class="section-title mb-4">Related Products</h3>
      <div class="products-grid" id="related-products-grid">
        <!-- Related products will be loaded dynamically -->
      </div>
    </section>
  </div>
</section>
