<!-- Login Page Content Fragment -->
<!-- This file is loaded dynamically by the router into #content -->

<!-- Breadcrumb Navigation -->
<div class="breadcrumb-container">
    <div class="breadcrumb-wrapper">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item">
                    <a href="/" class="breadcrumb-link" data-navigate="/">
                        <i class="bi bi-house-door breadcrumb-home-icon"></i>
                        <span>Beranda</span>
                    </a>
                </li>
                <li class="breadcrumb-item active" aria-current="page">
                    <span class="breadcrumb-link">Masuk</span>
                </li>
            </ol>
        </nav>
    </div>
</div>

<section class="login-section">
  <div class="container">
    <div class="login-container">
      <div class="login-card">
        <div class="login-header">
          <i data-lucide="user-circle" class="login-icon" aria-hidden="true"></i>
          <h2>Welcome Back</h2>
          <p>Login to access your account</p>
        </div>

        <form id="login-form" class="login-form">
          <div class="form-group">
            <label for="username">Username</label>
            <div class="input-group">
              <i data-lucide="user" aria-hidden="true"></i>
              <input
                type="text"
                id="username"
                placeholder="Enter username"
                required
                autocomplete="username"
              >
            </div>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <div class="input-group">
              <i data-lucide="lock" aria-hidden="true"></i>
              <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
                autocomplete="current-password"
              >
              <button type="button" class="toggle-password" id="toggle-password" aria-label="Show password">
                <i data-lucide="eye" aria-hidden="true"></i>
              </button>
            </div>
          </div>

          <div class="form-options">
            <label class="checkbox-label">
              <input type="checkbox" id="remember-me">
              <span>Remember me</span>
            </label>
            <a href="#" class="forgot-link">Forgot password?</a>
          </div>

          <div class="error-message hidden" id="error-message" role="alert">
            <i data-lucide="alert-circle" aria-hidden="true"></i>
            <span>Invalid username or password</span>
          </div>

          <button type="submit" class="btn-login">
            <span>Login</span>
            <i data-lucide="arrow-right" aria-hidden="true"></i>
          </button>
        </form>

        <div class="login-footer">
          <p>Demo credentials:</p>
          <div class="demo-credentials">
            <span><strong>Username:</strong> admin</span>
            <span><strong>Password:</strong> admin</span>
          </div>
        </div>
      </div>

      <div class="login-image">
        <div class="image-content">
          <i data-lucide="shopping-bag" aria-hidden="true"></i>
          <h3>Shop Fresh Fruits</h3>
          <p>Get access to exclusive deals and faster checkout</p>
        </div>
      </div>
    </div>
  </div>
</section>
